# Publica la tienda en GitHub Pages cada vez que cambia main.
# - Si la variable del repositorio VITE_API_URL existe (Settings → Secrets and variables →
#   Actions → Variables), publica la tienda real, que pide productos y pedidos a esa API.
# - Si no existe, publica la vista previa sin servidor: productos DEMO y pedidos desactivados.
# Requisito (una sola vez): Settings → Pages → Source: "GitHub Actions".
name: Tienda en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos publicaciones seguidas, gana la última
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar la tienda real (con API)
        if: vars.VITE_API_URL != ''
        run: npm run build:pages --workspace client
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Compilar la vista previa (DEMO, sin API)
        if: vars.VITE_API_URL == ''
        run: npm run build:preview --workspace client
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
